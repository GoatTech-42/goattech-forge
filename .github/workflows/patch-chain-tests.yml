name: Patch chain source tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    name: source-tests (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [c13, c14]   # pins C13_COMMIT / C14_COMMIT in build.sh
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned upstream and apply the Forge patch chain
        run: |
          set -euo pipefail
          bash tests/test-patch-pins.sh
          python3 scripts/verify-patch-pins.py
          VAR="$(echo '${{ matrix.board }}' | tr a-z A-Z)_COMMIT"
          COMMIT=$(grep -m1 "^${VAR}=" build.sh | cut -d'"' -f2)
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "no pin found for $VAR in build.sh"; exit 1; }
          echo "Board ${{ matrix.board }}: upstream pin $COMMIT"
          git clone --quiet https://github.com/navaismo/Marlin_bugfix_2.1_E3V3SE.git "$RUNNER_TEMP/marlin"
          git -C "$RUNNER_TEMP/marlin" checkout --quiet "$COMMIT"
          for p in forge-dwin-input-shaping-menu forge-74-sdclose-guard forge-diag-startguard forge-config-restore forge-diag-generator forge-diag-menu; do
            git -C "$RUNNER_TEMP/marlin" apply --check "$GITHUB_WORKSPACE/patches/$p.patch"
            git -C "$RUNNER_TEMP/marlin" apply "$GITHUB_WORKSPACE/patches/$p.patch"
          done
      - name: Source-level tests (no binary needed)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/marlin"
          bash tests/test-74-sdclose.sh "$T"
          bash tests/test-config-restore.sh "$T"
          bash tests/test-diag-startguard.sh "$T"
          bash tests/test-upstream-fixes.sh "$T"
          bash tests/test-diag-generator.sh "$T/Marlin"
          bash tests/test-menu-source-contract.sh "$T"
      - name: Real planner and temperature host harness (F1a, host simulation only)
        run: bash tests/test-harness-real-planner.sh "$RUNNER_TEMP/marlin"
      - name: G-code replay through the real planner (F1b, host simulation only)
        run: bash tests/test-harness-gcode-replay.sh "$RUNNER_TEMP/marlin"
      - name: Golden plate traces and motion-breaking checks (F1c, host simulation only)
        run: bash tests/test-trajectory-golden.sh "$RUNNER_TEMP/marlin"
      - name: build-real.sh scratch isolation and spaced paths (host build only)
        run: |
          set -euo pipefail
          bash tests/test-harness-build-isolation.sh "$RUNNER_TEMP/marlin"
          bash tests/test-harness-spaced-path.sh "$RUNNER_TEMP/marlin"
